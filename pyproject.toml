[project]
name = "agent-infra"
version = "0.1.0"
description = "Meta project knowledge base — hook designs, failure modes, architecture decisions"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.105.0",
    "claude-agent-sdk>=0.1.44",
    "corpus-core[all]",
    "duckdb>=1.1",
    "exa-py>=2.6.1",
    "fastmcp>=3.4.2,<4.0",
    "google-genai>=2.8.0",
    "inspect-ai>=0.3.0",
    "openai>=2.26.0",
    "parallel-web>=0.4.0",
    "plan-core",
]

[tool.uv.sources]
corpus-core = { path = "../substrate/packages/corpus-core", editable = true }
plan-core = { path = "../substrate/packages/plan-core", editable = true }

[project.scripts]
agentlogs = "agentlogs.cli:main"
agent-infra-mcp = "agent_infra_mcp:main"
corpus-mcp = "scripts.corpus_mcp:main"
duckdb-mcp = "duckdb_mcp:main"
modal-triage-mcp = "modal_triage_mcp:main"
parallel-mcp = "scripts.parallel_mcp:main"

[tool.pyright]
# venv resolution so imports resolve (diagnostic-channel hygiene)
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
exclude = ["artifacts/", "downloads/", "bundles/", ".claude/worktrees/"]
# substrate editable deps resolve at runtime via _editable_impl_*.pth, but Pyright
# only follows those when uv materializes a package dir (corpus-core does, via its
# force-include data files; pure-stdlib plan-core does not). List both source roots
# so static resolution is deterministic regardless of uv-sync materialization.
extraPaths = ["src", "../substrate/packages/plan-core", "../substrate/packages/corpus-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[dependency-groups]
dev = [
    "modal>=1.4.2",
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = [".", "src/agentlogs"]

[tool.hatch.build.targets.wheel.force-include]
"src/agentlogs" = "agentlogs"
